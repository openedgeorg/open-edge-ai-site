# Disposable local dependencies. Passwords are local-only and are not production secrets.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: esp
      POSTGRES_PASSWORD: esp
      POSTGRES_DB: esp
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esp -d esp"]
      interval: 2s
      timeout: 3s
      retries: 40
  valkey:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:63799:6379"
