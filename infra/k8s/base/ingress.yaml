apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esp-web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: esp-web
                port:
                  number: 8080
          - path: /conversations
            pathType: Prefix
            backend:
              service:
                name: esp-api
                port:
                  number: 8080
