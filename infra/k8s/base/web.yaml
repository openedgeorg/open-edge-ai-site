apiVersion: apps/v1
kind: Deployment
metadata:
  name: esp-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esp-web
  template:
    metadata:
      labels:
        app: esp-web
    spec:
      serviceAccountName: esp-web
      containers:
        - name: web
          image: esp-web:unqualified
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: esp-web
spec:
  selector:
    app: esp-web
  ports:
    - port: 8080
      targetPort: 8080
