apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-knowledge-no-runtime
spec:
  podSelector:
    matchLabels:
      app: esp-knowledge
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: esp-embeddings
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-web-no-evidence
spec:
  podSelector:
    matchLabels:
      app: esp-web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: esp-api
