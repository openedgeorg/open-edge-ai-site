# Isolated qualification namespace for DA-01 candidates (pending). It has no public ingress, no
# public-eligibility flag and its own data/credential namespaces chosen by the recorded candidate policy.
# Labels and Pod Security admission are configuration: they prove neither egress denial nor storage
# fencing. tests/qualification probes the enforced behaviour through scripts/qualify.py.
apiVersion: v1
kind: Namespace
metadata:
  name: esp-qualification
  labels:
    app.kubernetes.io/part-of: esp
    esp.openedge.dev/environment: isolated-qualification
    esp.openedge.dev/public-ingress: "false"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
