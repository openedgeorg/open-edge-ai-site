[project]
name = "esp-inference-gateway"
version = "0.1.0"
description = "Exact Brain and behavior verification for outbound provider requests."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-espcon",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-espcon = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_inference_gateway"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
