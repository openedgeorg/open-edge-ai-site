[project]
name = "esp-mcp"
version = "0.1.0"
description = "Versioned ESP knowledge retrieval. MCP transport is a later task."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "esp-embeddings",
    "esp-object-store",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }
esp-embeddings = { workspace = true }
esp-object-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
