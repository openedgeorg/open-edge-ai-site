[project]
name = "esp-mcp"
version = "0.1.0"
description = "Read-only MCP knowledge tools authorized from the current transport scope."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "esp-embeddings",
    "esp-execution-bindings",
    "esp-object-store",
    "esp-observability",
    "fastapi>=0.115",
    "mcp>=1.30",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }
esp-embeddings = { workspace = true }
esp-execution-bindings = { workspace = true }
esp-object-store = { workspace = true }
esp-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
