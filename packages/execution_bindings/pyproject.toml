[project]
name = "esp-execution-bindings"
version = "0.1.0"
description = "Audience-separated operation tokens and current-authority fences."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "esp-contracts",
    "esp-db",
    "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_execution_bindings"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
