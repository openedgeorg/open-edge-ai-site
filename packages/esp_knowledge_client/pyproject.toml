[project]
name = "esp-knowledge-client"
version = "0.1.0"
description = "Read-only published source and asset inspection. It does not call a model."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_knowledge_client"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
