[project]
name = "esp-object-store"
version = "0.1.0"
description = "Immutable checksummed object reads and writes. No provider SDK."
requires-python = ">=3.12"
dependencies = ["esp-contracts"]

[tool.uv.sources]
esp-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_object_store"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
