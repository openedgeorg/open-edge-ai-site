[project]
name = "esp-runtime-placement"
version = "0.1.0"
description = "Healthy compatible placement and non-waiting resident, active and provider slot claims."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_runtime_placement"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
