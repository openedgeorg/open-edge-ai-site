[project]
name = "esp-provider-router"
version = "0.1.0"
description = "Fixed provider-to-native-pool routing and the routed native adapter contract."
requires-python = ">=3.12"
dependencies = ["esp-contracts"]

[tool.uv.sources]
esp-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_provider_router"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
