[project]
name = "esp-espcon"
version = "0.1.0"
description = "ESP Conversation release pins. Selection metadata is separate from immutable bytes."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-object-store",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-object-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_espcon"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
