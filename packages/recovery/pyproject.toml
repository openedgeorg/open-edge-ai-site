[project]
name = "esp-recovery"
version = "0.1.0"
description = "Group recovery behind a positive storage fence. Never replays visitor input."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "esp-provider-shared",
    "pydantic>=2.10",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }
esp-provider-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_recovery"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
