[project]
name = "esp-request-admission"
version = "0.1.0"
description = "Immediate SQL admission with truthful contention outcomes and atomic Valkey rate counters."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "esp-espcon",
    "esp-runtime-placement",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "redis>=8.1",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }
esp-espcon = { workspace = true }
esp-runtime-placement = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_request_admission"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"lua/token_bucket.lua" = "esp_request_admission/lua/token_bucket.lua"
