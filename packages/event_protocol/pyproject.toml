[project]
name = "esp-event-protocol"
version = "0.1.0"
description = "Public chat event union and later native-history normalization."
requires-python = ">=3.12"
dependencies = ["esp-contracts", "pydantic>=2.10"]

[tool.uv.sources]
esp-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_event_protocol"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
