[project]
name = "esp-db"
version = "0.1.0"
description = "Bounded psycopg access to current ESP authority. No ORM."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
esp-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_db"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
