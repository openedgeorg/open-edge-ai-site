[project]
name = "esp-site-tooling"
version = "0.1.0"
description = "ESP site operator tooling. Application services live in workspace members."
requires-python = ">=3.12"
dependencies = [
    "esp-contracts",
    "esp-db",
    "esp-espcon",
    "esp-event-protocol",
    "esp-execution-bindings",
    "esp-embeddings",
    "esp-inference-gateway",
    "esp-mcp",
    "esp-object-store",
    "esp-provider-openai",
    "esp-provider-shared",
    "esp-provider-xai",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.2",
    "pyright>=1.1.392",
]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-db = { workspace = true }
esp-espcon = { workspace = true }
esp-event-protocol = { workspace = true }
esp-execution-bindings = { workspace = true }
esp-embeddings = { workspace = true }
esp-inference-gateway = { workspace = true }
esp-mcp = { workspace = true }
esp-object-store = { workspace = true }
esp-provider-openai = { workspace = true }
esp-provider-shared = { workspace = true }
esp-provider-xai = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/db",
    "packages/espcon",
    "packages/event_protocol",
    "packages/execution_bindings",
    "packages/object_store",
    "services/esp_embeddings",
    "services/esp_inference_gateway",
    "services/esp_mcp",
    "providers/openai",
    "providers/shared",
    "providers/xai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "qualification: credentialed live gates; run only through scripts/qualify.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages", "apps", "providers", "services", "scripts", "knowledge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "esp_api",
    "esp_contracts",
    "esp_db",
    "esp_embeddings",
    "esp_espcon",
    "esp_event_protocol",
    "esp_execution_bindings",
    "esp_inference_gateway",
    "esp_knowledge_client",
    "esp_mcp",
    "esp_object_store",
    "esp_observability",
    "esp_provider_openai",
    "esp_provider_router",
    "esp_provider_shared",
    "esp_provider_xai",
    "esp_recovery",
    "esp_request_admission",
    "esp_runtime_harconses",
    "esp_runtime_placement",
    "knowledge",
    "scripts",
    "tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["packages", "scripts", "knowledge", "services", "tests", "providers"]
extraPaths = ["tests"]
exclude = ["**/node_modules", "**/.venv", "tests/qualification"]
