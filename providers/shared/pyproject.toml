[project]
name = "esp-provider-shared"
version = "0.1.0"
description = "Shared native harness RPC client and operation transport context."
requires-python = ">=3.12"
dependencies = ["esp-contracts", "esp-observability", "pydantic>=2.10"]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_provider_shared"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
