[project]
name = "esp-provider-openai"
version = "0.1.0"
description = "Codex App Server integration for the exact captured candidate build."
requires-python = ">=3.12"
dependencies = ["esp-contracts", "esp-provider-shared", "pydantic>=2.10"]

[tool.uv.sources]
esp-contracts = { workspace = true }
esp-provider-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_provider_openai"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
